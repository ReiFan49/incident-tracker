name: Generate Page

on:
  push:
    paths:
    - '.github/workflows/gneerate-page.yml'
    - 'incidents/**'
    - 'scripts/**'

  repository_dispatch:
    types:
    - incident_page_refresh

jobs:
  generate:
    name: Generate Static Page
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Setup Worktree
      run: scripts/setup-worktree
    - name: Check All Incident Statuses
      run: scripts/check-all-incident-statuses
    - name: Generate Page
      run: scripts/generate-incident-page
    - name: Commit the Changes
      working-directory: docs
      run: |
        CO=(
          --author="github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
        )
        PO=()

        git config user.name  'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git config push.autoSetupRemote true

        if [[ -n "${{ (github.event_name == 'push' && github.event.forced) && '1' || '' }}" ]]; then
          CO+=(--amend)
          PO+=(-f)
        fi

        git add .

        if [[ ${{ github.event_name }} = 'push' ]]; then
          git commit "${CO[@]}" -m "generated from \`${GITHUB_SHA:0:8}\`"
        else
          git commit "${CO[@]}" -m "generated through trigger at \`$(date +'%Y-%m-%d %H:%M:%S')\`"
        fi
        git push "${PO[@]}"
